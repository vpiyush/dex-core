[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

# Workspace-local deps only: benchkit supplies the Comparison engine so the
# verdict logic exists in exactly one place. The runner still shells out to
# `cargo`/`valgrind`/`perf` via std::process and parses its flags by hand.
[dependencies]
benchkit = { path = "../crates/benchkit" }
